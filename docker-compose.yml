services:
  app:
    build: .
    container_name: booklist_app
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: booklist
      DB_SSLMODE: disable
      SERVER_ADDR: ":8080"
    ports:
      - "8080:8080"
    networks:
      - portfolio-net

networks:
  portfolio-net:
    external: true
