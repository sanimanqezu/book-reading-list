version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: booklist_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: booklist
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d booklist"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: booklist_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: booklist
      DB_SSLMODE: disable
      SERVER_ADDR: ":8080"
    ports:
      - "8080:8080"

volumes:
  postgres_data:
